; =============================================================
; HabitTracker — Tamagotchi Habit Companion Firmware
; Target: Seeed SenseCAP Watcher (ESP32-S3R8)
; =============================================================
;
; HARDWARE REFERENCE (pins, SPD2010 QSPI, IO expander, knob):
;   Seeed SenseCAP-Watcher-Firmware — components/sensecap-watcher/
;   include/sensecap-watcher.h and examples/ (e.g. get_started, knob_rgb)
;   https://github.com/Seeed-Studio/SenseCAP-Watcher-Firmware
;
; DISPLAY: Solomon SPD2010, 412×412, quad-SPI on SPI3_HOST (NOT GC9A01).
; KNOB:   GPIO41=A, GPIO42=B; push button is PCA9535 expander pin 3.
; RGB:    WS2812 on GPIO40 (used as “haptic” pulse — no vibration motor).
; CAMERA: Vision pipeline is on the SSCMA module, not esp_camera on ESP32.
;
; BOARD: esp32-s3-devkitc-1 — set upload_port for your Watcher.
;
; Flash / PSRAM must match SenseCAP Watcher silicon (see Seeed SDK):
;   _watcher_fw/examples/*/sdkconfig.defaults → CONFIG_ESPTOOLPY_FLASHSIZE_32MB,
;   CONFIG_ESPTOOLPY_FLASHMODE_QIO, CONFIG_SPIRAM_MODE_OCT (80 MHz).
;   https://github.com/Seeed-Studio/SenseCAP-Watcher-Firmware
; Using 8 MB here can mis-tag the image and break boot / PSRAM init.
; =============================================================

[platformio]
default_envs = seeed_sensecap_watcher
data_dir     = data

[env:seeed_sensecap_watcher]
platform  = espressif32@^6.6.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu        = esp32s3
board_build.f_cpu      = 240000000L
board_build.flash_size = 32MB
board_build.flash_mode = qio
board_build.f_flash    = 80000000L
board_build.psram_type = opi
; QIO flash + octal (OPI) PSRAM — same pairing as Seeed IDF examples.
board_build.memory_type = qio_opi
; Arduino-ESP32 3.x ignores the generic board_build.* overrides above for
; memory layout / flash params — it only reads the `arduino.` + `upload.`
; prefixed keys below. Without these, the framework silently falls back to
; the esp32-s3-devkitc-1-N8 defaults (8MB DIO, no PSRAM) and the 2nd-stage
; bootloader crash-loops on Watcher silicon.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304

board_build.partitions = large_littlefs_32MB.csv
board_build.filesystem = littlefs

monitor_speed   = 115200
monitor_port      = COM3
monitor_filters = esp32_exception_decoder
; Avoid asserting bootloader strapping via serial control lines when monitor opens.
monitor_dtr     = 0
monitor_rts     = 0
upload_speed    = 921600
; Watcher UART bridge on this machine (auto-detect often picks another COM).
upload_port     = COM3

build_flags =
  -I"${PROJECT_DIR}/include"
  ; Watcher routes USB only through the CH342 bridge to UART0 (COM3 on host).
  ; The ESP32-S3 native USB-CDC D+/D- pins are NOT exposed to the connector,
  ; so Serial must be attached to UART0, not CDC.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_BLE_ENABLED=1
  ; Arduino_ESP32QSPI default host is SPI2 — Watcher LCD is on SPI3_HOST
  -DESP32QSPI_SPI_HOST=SPI3_HOST

lib_deps =
  ; 1.6.x targets Arduino-ESP32 3.x / IDF 5. Stay on 1.4.x for PlatformIO espressif32@6.
  moononournation/GFX Library for Arduino@1.4.7
  bblanchon/ArduinoJson@^7.0.4
  arduino-libraries/NTPClient@^3.2.1
  adafruit/Adafruit NeoPixel@^1.12.0
  bitbank2/JPEGDEC@^1.6.0
